version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  token:
    build:
      context: .
      dockerfile: Dockerfile.token
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["node", "token-server.js"]
    ports:
      - "3002:3002"
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    ports:
      - "3000:3000"
    command: ["npm", "start"]
    depends_on:
      - backend

  livekit:
    image: livekit/livekit:latest
    command: ["livekit-server", "--dev"]
    # If you end up running LiveKit with keys or config, replace the command and add envs/volumes accordingly.
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7883:7883"   # RTP / UDP mapping depends on your host/infra — adjust if needed
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
